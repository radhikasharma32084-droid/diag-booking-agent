<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Diagnostic Test Booking Agent</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>🩺 Diagnostic Test Booking Agent</h1>
      <p>Tell me what test you need — I'll compare labs near you and book the best one.</p>
    </header>

    <div id="chat" class="chat"></div>

    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="e.g. I need a CBC and Vitamin D test" autocomplete="off" />
      <button type="submit">Send</button>
    </form>

    <details id="audit-box" style="display:none;">
      <summary>See how the agent decided (audit trail)</summary>
      <pre id="audit-content"></pre>
    </details>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
